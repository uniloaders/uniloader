[package]
name = "overlay"
description = "uniloader plugin drawing an in-game overlay: console, settings editor, and the `overlay` service other plugins draw panels through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "overlay"
crate-type = ["cdylib", "rlib"]

[dependencies]
uniloader-sdk.workspace = true
uniloader-core.workspace = true
uniloader-overlay.workspace = true
log.workspace = true
egui.workspace = true

[target.'cfg(windows)'.dependencies]
egui-directx11 = "0.13"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
