[workspace]
resolver = "2"
members = [
    "crates/uniloader-api",
    "crates/uniloader-core",
    "crates/uniloader-sdk",
    "crates/uniloader",
    "crates/uniloader-overlay",
    "crates/source-rcon",
    "examples/hello-plugin",
    "examples/smoke-host",
    "examples/kitchen-sink",
    "plugins/lua-bridge",
    "plugins/overlay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
uniloader-api = { path = "crates/uniloader-api" }
uniloader-core = { path = "crates/uniloader-core" }
uniloader-sdk = { path = "crates/uniloader-sdk" }
uniloader-overlay = { path = "crates/uniloader-overlay" }
source-rcon = { path = "crates/source-rcon" }
# The overlay's UI library. Pure Rust (nothing for clang-cl to compile) and it emits plain
# meshes, which is what lets a panel be drawn by any renderer, or onto a VR quad.
# `egui-directx11` pins egui 0.35, hence the exact minor.
egui = { version = "0.35", default-features = false, features = ["default_fonts"] }
log = "0.4"
thiserror = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
# "deny" instead of "forbid": the loader and the SDK are FFI boundaries and need unsafe in
# exactly one module each, with a scoped allow and a reason. "forbid" cannot be re-allowed.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = true
codegen-units = 1
debug = "line-tables-only"
# Never "abort": a plugin panic must unwind so the loader can catch it at the boundary.
panic = "unwind"

# Password hashing is deliberately slow; unoptimised it takes seconds per hash in tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
