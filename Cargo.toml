[workspace]
resolver = "2"
members = [
    "crates/uniloader-api",
    "crates/uniloader-core",
    "crates/uniloader-sdk",
    "crates/uniloader",
    "examples/hello-plugin",
    "examples/smoke-host",
    "plugins/lua-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
uniloader-api = { path = "crates/uniloader-api" }
uniloader-core = { path = "crates/uniloader-core" }
uniloader-sdk = { path = "crates/uniloader-sdk" }
log = "0.4"
thiserror = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
# "deny" instead of "forbid": the loader and the SDK are FFI boundaries and need unsafe in
# exactly one module each, with a scoped allow and a reason. "forbid" cannot be re-allowed.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = true
codegen-units = 1
debug = "line-tables-only"
# Never "abort": a plugin panic must unwind so the loader can catch it at the boundary.
panic = "unwind"
